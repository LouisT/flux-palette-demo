# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: "Flux Palette" # Site name shown in the header and page titles.
subtitle: "Preview" # Short tagline displayed below the site title.
description: "This is a preview site for the Flux Palette hexo theme." # Default description for site metadata.
keywords: # Optional site keywords; leave empty when unused.
author: "LouisT" # Default author name for credits and feed entries.
language: en # Language code for site metadata and localized text.
timezone: "America/Los_Angeles" # Timezone used when interpreting and displaying dates.

# URL
## Set your site url here. For example, if you use GitHub Pages, set url as 'https://username.github.io/project'
url: https://flux-palette.louist.dev # Public site URL, including any deployment subdirectory.
permalink: :year/:month/:day/:title/ # URL pattern for individual posts.
permalink_defaults: # Optional default values for custom permalink placeholders.
pretty_urls: # Control whether generated links retain file suffixes.
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source # Directory containing posts, pages, and source assets.
public_dir: public # Directory where Hexo writes the generated site.
tag_dir: tags # Output directory for post tag pages.
archive_dir: archives # Output directory for archive pages.
category_dir: categories # Output directory for post category pages.
code_dir: downloads/code # Source directory for downloadable code used by include_code tags.
i18n_dir: :lang # Directory pattern for language-specific content.
skip_render: # Source file patterns to copy without rendering.

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post # Default layout used by hexo new.
titlecase: false # Transform title into titlecase
external_link: # Configure how rendered external links open.
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: "" # Domains exempt from the external-link behavior.
filename_case: 0 # Filename case: 0 preserves it, 1 uses lowercase, 2 uses uppercase.
render_drafts: false # Include files from source/_drafts in the generated site.
post_asset_folder: false # Create a separate asset directory for each new post.
relative_link: false # Generate links relative to the current page when true.
future: true # Publish posts whose date is in the future.

# Blog feed settings (also used by the homepage; further listings live under /blog/)
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator: # Default post-list pagination and sorting settings.
  per_page: 4 # Posts per page; blog.per_page in the theme config can override this.
  order_by: -date # Sort newest first; date without the minus sign sorts oldest first.

# Category & Tag
default_category: uncategorized # Category assigned to posts without an explicit category.
category_map: # Optional category-name to URL-slug mappings.
tag_map: # Optional tag-name to URL-slug mappings.

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true # Include the Hexo generator meta tag in page metadata.

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD # Display format for dates.
time_format: HH:mm:ss # Display format for times.
## updated_option supports 'mtime', 'date', 'empty'
updated_option: "mtime" # Fallback updated date: file modification time, post date, or empty.

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10 # Default items per page for generators without their own override.
pagination_dir: page # URL segment for later listing pages, such as /blog/page/2/.

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include: # Source file patterns to include even when normally excluded.
exclude: # Source file patterns to exclude from the generated site.
ignore: # File patterns Hexo should ignore during source processing.

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: flux-palette # Theme directory name under themes/.
# Theme preferences live in the adjacent _config.flux-palette.yml.

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy: # Deployment plugin settings for hexo deploy.
  type: "" # Deployment adapter name; leave empty to disable deployment.

social: # Links used by sidebar social buttons and the social_links tag.
  - name: GitHub # Accessible label for this social link.
    url: https://github.com/LouisT/hexo-theme-flux-palette # Link destination.
    icon: mdi:github # Iconify icon identifier.
  - name: Website # Accessible label for this social link.
    url: https://flux-palette.louist.dev/ # Link destination.
    icon: material-symbols:link # Iconify icon identifier.

syntax_highlighter: highlight.js # Code highlighting engine used by Hexo.
highlight: # Options for the highlight.js engine.
  auto_detect: false # Guess the language of code blocks without a language label.
  line_number: true # Show line numbers beside highlighted code.
  line_threshold: 0 # Show line numbers when a block exceeds this line count; 0 includes all nonempty blocks.
  tab_replace: "" # Text used to replace tabs; empty preserves tabs.
  wrap: true # Wrap highlighted code in the markup expected by the theme.
  hljs: false # required to be false for Flux Palette styles
